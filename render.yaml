services:
  # Backend
  - type: web
    name: playto-pay-backend
    env: python
    buildCommand: "./render-build.sh"
    startCommand: "gunicorn playto_pay.wsgi"
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: playto-pay-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "playto-pay-backend.onrender.com,playto-pay-frontend.onrender.com"

  # Frontend
  - type: web
    name: playto-pay-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromStack:
          type: web
          name: playto-pay-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: playto-pay-db
    plan: free
